<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>brbott 微信数据网桥</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 14px;
            background-color: #0f172a;
            color: #f1f5f9;
            margin: 0;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 12px;
        }

        h1 {
            color: #38bdf8;
            font-size: 18px;
            margin: 0;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 11px;
            margin: -6px 0 6px 0;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            background: #0f172a;
            border: 1px solid #475569;
            color: #f1f5f9;
            padding: 6px 10px;
            font-size: 12px;
            border-radius: 6px;
            font-family: monospace;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #38bdf8;
        }

        button {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.15s;
        }

        button:hover {
            background-color: #0369a1;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            padding: 2px 0;
        }

        .status-label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #cbd5e1;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot.red { background-color: #ef4444; box-shadow: 0 0 6px #ef4444; }
        .dot.yellow { background-color: #eab308; box-shadow: 0 0 6px #eab308; }
        .dot.green { background-color: #22c55e; box-shadow: 0 0 6px #22c55e; }

        .status-val {
            font-weight: 700;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            background: #0f172a;
        }

        .status-val.disconnected { color: #f87171; }
        .status-val.connecting { color: #fbbf24; }
        .status-val.connected { color: #4ade80; }
        .status-val.offline { color: #94a3b8; }
        .status-val.online { color: #38bdf8; }

        .credential-box {
            font-family: monospace;
            font-size: 11px;
            color: #e2e8f0;
            word-break: break-all;
            background: #0f172a;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #334155;
            max-height: 48px;
            overflow-y: auto;
        }

        .logs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        .logs-title {
            font-size: 12px;
            font-weight: bold;
            color: #38bdf8;
            margin: 0;
        }

        #logs {
            flex-grow: 1;
            background: #090d16;
            border: 1px solid #1e293b;
            color: #10b981;
            overflow-y: auto;
            border-radius: 8px;
            padding: 10px;
            font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
            font-size: 11px;
            line-height: 1.5;
            text-align: left;
        }

        .log-entry {
            border-bottom: 1px solid #1e293b;
            padding-bottom: 6px;
            margin-bottom: 6px;
            word-break: break-all;
        }

        .log-time {
            color: #64748b;
            font-size: 10px;
            margin-right: 6px;
        }

        .log-type {
            font-weight: bold;
            color: #fbbf24;
            margin-right: 6px;
        }

        .log-text {
            color: #38bdf8;
        }

        .log-success {
            color: #34d399;
        }

        .log-error {
            color: #f87171;
        }
    </style>
</head>

<body>
    <div id="app">
        <h1>brbott 微信数据网桥</h1>
        <p class="subtitle">Headless WebSocket Crawling Node</p>

        <!-- WebSocket Configuration Card -->
        <div class="card">
            <label for="wsUrl">Admin WebSocket Server:</label>
            <div class="input-row">
                <input type="text" id="wsUrl" value="ws://localhost:6688" placeholder="ws://localhost:6688" />
                <button id="connectBtn">连接</button>
            </div>
        </div>

        <!-- Connection Status Card -->
        <div class="card">
            <div class="status-row">
                <span class="status-label">
                    <span id="wsDot" class="dot red"></span>
                    WS 连接通路:
                </span>
                <span id="wsStatus" class="status-val disconnected">未连接</span>
            </div>
            <div class="status-row">
                <span class="status-label">
                    <span id="sessionDot" class="dot red"></span>
                    微信凭证拦截:
                </span>
                <span id="sessionStatus" class="status-val offline">未捕获</span>
            </div>
        </div>

        <!-- Captured Credentials Card -->
        <div class="card">
            <label>会话 Token:</label>
            <div id="capturedToken" class="credential-box">无</div>
            <label style="margin-top: 4px;">安全指纹 FP:</label>
            <div id="capturedFp" class="credential-box">无</div>
        </div>

        <!-- Live logs area -->
        <div class="logs-header">
            <h3 class="logs-title">系统实时数据日志</h3>
            <button id="clearBtn" style="background-color: #475569; padding: 2px 8px; font-size: 10px; border-radius: 4px;">清空</button>
        </div>
        <div id="logs">
            <div class="log-entry">
                <span class="log-time">[系统]</span>
                <span class="log-type">INFO</span>
                <span class="log-text">等待连接 WebSocket 服务端...</span>
            </div>
        </div>
    </div>

    <!-- Script references -->
    <script src="sidepanel.js"></script>
</body>

</html>
